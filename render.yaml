services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: campushire-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campushire-postgres
          property: connectionString
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true

databases:
  # 2. Render Managed PostgreSQL Database
  - name: campushire-postgres
    databaseName: campushire
    user: campushire_user
    plan: free
    region: oregon
